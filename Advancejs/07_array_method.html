<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- array method :- Easy method iunbulit -->

    <script>

        let arr = [1, 2, 3, 4, 5]

        console.log(arr.length)

        let arr2 = [6,7,8,9,10]

        console.log(arr.concat(arr2))

        // add push add after
        console.log(arr)
        arr.push(6)
        console.log(arr)

        // after value remove 
        arr.pop()
        console.log(arr)

        // before remove
        arr.shift()
        console.log(arr)

        arr.unshift(0)
        console.log(arr)

        const element = ["one","two","three","Four","five","Six"]

        console.log(element)
        // console.log(element.slice(3))
        console.log(element.slice(1,4))

        const words = ["spray", "elite", "exuberant", "destruction", "present"];

        const resu = words.filter((data)=> data.length > 6)

        console.log(resu)



    </script>
</body>

</html>
