<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- function ;- it block of code. use it Call  -->

    <script>

        // wihout paramter
        function sum(){
            let a=20,b=10;
            console.log("sum =>",a+b)
        }
        sum()

        const sub=()=>{
            let a=30,b=10;
            console.log("sub =>",a-b)
        }
        sub()
        sub()


        //with parameter
        function mul(a,b){
            console.log("mul =>",a*b)
        }
        mul(20,10)

        const divi=(a,b)=>{
            console.log("divi =>",a/b)
        }
        divi(400,20)
        divi(20,10)




    </script>
</body>
</html>
