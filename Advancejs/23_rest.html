<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ... :- data store value  -->
    <!-- ... rest :- function parameter -->
    <!-- ... spread -->


    <script>

// rest opertor :- value
        function test(...mahi){
            let score = 0
            for(let dhoni in mahi){
                score = score + mahi[dhoni]
            }
            return score
        }

        console.log(test(50,60,30,40))

        

    </script>
</body>
</html>
