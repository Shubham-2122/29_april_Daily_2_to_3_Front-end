<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <table border="5">
        <thead>
            <tr>
                <th>Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>City</th>
                <th>company</th>
            </tr>
        </thead>
        <tbody class="data">

        </tbody>
    </table>

    <script>
        fetch("https://jsonplaceholder.typicode.com/users",{
            method:"GET"
        })
        .then((res)=>{
            return res.json()
        })
        .then((data)=>{
            console.log(data)
            data.forEach((user,index) => {
                console.log(user)

                let tablebody = document.querySelector(".data")

                // forEach retrun
                let tablerow = tablebody.insertRow();
                let idcell = tablerow.insertCell(0);
                let namecell = tablerow.insertCell(1);
                let emailcell = tablerow.insertCell(2);
                let citycell = tablerow.insertCell(3);
                let companycell = tablerow.insertCell(4)

                idcell.textContent = user.id
                namecell.textContent = user.name
                emailcell.textContent = user.email
                citycell.textContent = user.address.city
                companycell.textContent = user.company.name

            });
        })
    </script>
</body>
</html>
