<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- case  -->

    <script>
        let x = 15, y = 10

        let choice = ")"

        switch (choice) {
            case "+":
                console.log("Sum =>", x + y)
                break;
            case "-":
                console.log("Sub =>", x - y)
                break;
            case "*":
                console.log("mul =>", x * y)
                break;
            case "/":
                console.log("divi1 =>", x / y)
                break;

            default:
                console.log("Inavlid symbols")
                break;
        }

    </script>
</body>

</html>
