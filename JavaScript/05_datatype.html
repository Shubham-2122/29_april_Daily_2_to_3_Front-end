<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- datatype :- 
        1) primitive  :- single values
        2) non-primitive :- muitple values
    -->

    <!-- 
        7 type 
        1) string 
        2) number 
        3) boolen
        4) undfined
        5) null
        6) bigint
        7) symbol

    -->


    <script>

        // 1) number 
        let num1 = 12.5
        console.log(num1)
        console.log(typeof(num1))

        // 2) string 
        // let str = "Hello"
        let str = 'hello'
        console.log(str)
        console.log(typeof(str))

        // 3) boolean 
        let data = false 
        // let data = true
        console.log(data)
        console.log(typeof(data))

        // 4) undefined

        let data1; 
        console.log(data1)
        console.log(typeof(data1))

        // 5) null
        let num2 = null
        console.log(num2)
        console.log(typeof(num2))

        // 6) big int 
        let xy = BigInt(23457467236)
        console.log(xy)
        console.log(typeof(xy))

        // 7) symbol 
        let sb = Symbol("asdhjh")
        console.log(sb)
        console.log(typeof(sb))


    </script>

</body>
</html>
