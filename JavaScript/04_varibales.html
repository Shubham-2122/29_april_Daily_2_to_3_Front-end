<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- varibales :- A store data as varibale (name) -->
    <!-- 
    varibale rules :- 
    1) do not start with number 12shub
    2) do not start with symbole $sad
    3) do not start with keyword (name,alert) -->

    <!-- syntax :-  -->
    <!-- varible-type variblename = values -->


    <script>
        console.log("hello this Varibles")

        // 3 type varibals define 
        // 1) var :- global 

        var x = 10 // decalration allow
        var x = 20 //re-decalration allow
        x = 30  //re-assigement allow
        console.log("x =>",x)  
        document.write("X =>",x,"<br>")


        // 2) let :- local 
        let y = 40 // decalration allow
        // let y = 50 //re-decalration not allow
        y = 50  // re-assigement allow
        
        console.log("y =>",y)
        document.writeln("y =>",y,"<br>")

        // 3) const :- unique 

        const z = 70 //// decalration allow
        // const z = 80 // re-decalration not allow
        // z = 80 // re-assigement not allow


        console.log("z =>",z) 
        document.write("z ==>",z)

    </script>

</body>
</html>
