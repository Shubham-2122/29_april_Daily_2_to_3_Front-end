<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <table align="center">
        <caption>Form data</caption>
        <form action="" >
            <tr>
                <td><input type="text" placeholder="Enter your name" onblur="return validation(nm,nmerr)" id="nm"></td>
                <td><span id="nmerr"></span></td>
            </tr>
              <tr>
                <td><input type="tel" placeholder="Enter your phone" onblur="return validation(mb,mberr)" id="mb"></td>
                <td><span id="mberr"></span></td>
            </tr>
            <tr>
                <td><input type="email" placeholder="Enter your Email" onblur="return validation(email,emerr)" id="email"></td>
                <td><span id="emerr"></span></td>
            </tr>
            <tr>
                <td><input type="password" onblur="return validation(psw,pswerr)" placeholder="Enter your password" id="psw"></td>
                <td><span id="pswerr"></span></td>
            </tr>
            <tr>
                <td align="center" colspan="2"><input type="submit"></td>
            </tr>
        </form>
    </table>

    <script>

        function validation(inp,err){
            if(inp.value == "" || inp.value == null){
                err.innerHTML = "Pls Field form..!"
                err.style.color = "red"
                inp.style.border = "2px solid red"
                return false
            }
            else{
                err.innerHTML = ""
                err.style.color = ""
                inp.style.border = "2px solid green"
            }
        }


    </script>
</body>
</html>
