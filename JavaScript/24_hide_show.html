<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            background: linear-gradient(red,green,blue);
            color: white;
            font-size: 50px;
            font-weight: bold;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <button onclick="adddata()">Add css</button>
    <button onclick="removedata()">remove</button>

    <button onclick="toggledata()">Toggle</button>

    <div id="main">
        THis is Div Tag
    </div>

    <script>
        let div_tag =document.getElementById("main")
        console.log(div_tag)

        function adddata(){
            div_tag.classList.add("main")
            console.log("add data");
        }

        function removedata(){
            div_tag.classList.remove("main")
            
        }

        function toggledata(){
            div_tag.classList.toggle("main")
        }
    </script>
</body>
</html>
