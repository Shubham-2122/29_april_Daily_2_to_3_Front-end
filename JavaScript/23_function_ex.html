<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="h1" onmouseenter="add()" onmouseleave="remove()">Hello this h1 tag</h1>

    <button onclick="add()">add css</button>

    <script>

        let h1_tag = document.getElementById("h1")
        console.log(h1_tag)

        function add() {
            h1_tag.style.background = "red";
            h1_tag.style.fontSize = "50px";
            h1_tag.style.padding = "20px"
        }

          function remove() {
            h1_tag.style.background = "blue";
            h1_tag.style.fontSize = "25px";
            h1_tag.style.padding = "10px"
        }


    </script>
</body>

</html>
